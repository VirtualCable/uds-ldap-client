[package]
name = "uds-ldap-client"
version = "0.1.2"
edition = "2024"
authors = ["Adolfo Gómez <dkmaster@dkmon.com>"]
description = "LDAP client library for UDS, implemented in Rust with PyO3 bindings"
license = "BSD-3-Clause"

[lib]
name = "uds_ldap_client"
crate-type = ["cdylib"]

[dependencies]
# abi3: one wheel covers every CPython >= 3.12.
# extension-module is enabled from pyproject.toml (maturin) so that
# `cargo test` links libpython normally and does not fail at link time.
pyo3 = { version = "0.30", features = ["abi3-py312"] }
ldap3 = { version = "0.12", default-features = false, features = [
    "sync",
    "tls-rustls-aws-lc-rs",
] }
rustls = "0.23"
rustls-native-certs = "0.8"
log = "0.4"
thiserror = "2"
